name: Build and Release OnePlus 15 (ColorOS 17) Kernel

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      custom_release_tag:
        description: 'Provide a custom release tag (e.g., v2.3.0-r4). Leave empty to auto-generate.'
        required: false
        type: string
        default: ''
      op_model:
        description: 'Select the device profile to build'
        required: true
        type: choice
        options:
          - OP15-COS17
          - All
        default: OP15-COS17
      android_version_filter:
        description: 'Select the Android Version filter'
        required: true
        type: choice
        options:
          - A16
          - All
        default: A16
      kernel_version_filter:
        description: 'Select the Kernel Version filter'
        required: true
        type: choice
        options:
          - android16-6.12
          - All
        default: android16-6.12
      ksu_options:
        description: 'Enter root variant build JSON (sukisu = SukiSU-Ultra, ksun = KernelSU-Next, ksu = KernelSU)'
        required: true
        type: string
        default: '[{"type":"sukisu","hash":"builtin"},{"type":"ksun","hash":"dev"}]'
      ksu_mode:
        description: 'Root Integration Mode (builtin = In-tree with full SUSFS support [Recommended], lkm = Modular LKM)'
        required: true
        type: choice
        options:
          - builtin
          - lkm
        default: builtin
      autofdo_profile_url:
        description: 'Optional custom kernel.afdo URL override (leave empty for pinned AOSP android16-6.12 profile)'
        required: false
        type: string
        default: ''
      autofdo_profile_sha256:
        description: 'Optional SHA-256 checksum for a custom autofdo_profile_url override'
        required: false
        type: string
        default: ''
      enable_etm:
        description: 'Allow coresight_uetm to load for CoreSight ETM AutoFDO capture (default: false)'
        type: boolean
        default: false
      optimize_level:
        description: "Compiler optimization level"
        required: true
        type: choice
        options: [O2, O3]
        default: O2
      mlgo:
        description: 'Do you want to enable mlgo? [Machine Learning Guided Optimization]'
        required: false
        type: boolean
        default: true
      lto_override:
        description: "Force an LTO mode for this run only. Leave on 'config' to use each device's own setting. Exists so LTO can be tested on a profile without editing its config and committing the change."
        required: false
        type: choice
        options:
          - config
          - none
          - thin
          - full
        default: config
      clean_build:
        description: 'Clean build (no ccache)'
        type: boolean
        default: false
      sync_toolchains:
        description: 'Do you want to sync toolchains before build? [99% runs not required]'
        required: true
        type: boolean
        default: false
      debug:
        description: 'Enable debug mode: dumping debug related artifacts and show some debug logs'
        required: false
        type: boolean
        default: false
      make_release:
        description: 'Create a GitHub Release'
        type: boolean
        default: false
      publish_release:
        description: 'Publish GitHub Release immediately (uncheck to save as Draft)'
        type: boolean
        default: true
      prerelease:
        description: 'Mark GitHub Release as a Pre-release (for test builds)'
        type: boolean
        default: false
      build_timestamp:
        description: 'Custom kernel build timestamp for uname -a (e.g. "Tue Feb 10 10:01:02 UTC 2026"). Leave empty for current time.'
        type: string
        default: ''
      workflow_mode:
        description: 'Select the workflow mode'
        required: true
        type: choice
        options:
          - 'Build & Release'
          - 'Release Only'
        default: 'Build & Release'
      run_id_to_release:
        description: 'Run ID to pull artifacts from (Only for "Release Only" mode)'
        required: false
        type: string
        default: ''
      custom_changelog:
        description: 'Custom changelog for the release (Optional, overrides auto-gen)'
        required: false
        type: string
        default: ''
      android16-6_12_susfs_branch_or_commit:
        description: 'Enter SusFS Branch or commit hash for android16-6.12'
        type: string
        default: 'c6788e2a21dc717beb7dd3a36b729b58bc909927'

jobs:
  set-op-model:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      matrix_A16: ${{ steps.set-matrix.outputs.matrix_A16 }}
      device_count: ${{ steps.set-matrix.outputs.count }}
      active_gki_keys: ${{ steps.set-matrix.outputs.active_gki_keys }}
      susfs_hash_android16_6_12: ${{ steps.set-matrix.outputs.susfs_hash_android16_6_12 }}
      ksu_resolved_hash: ${{ steps.set-matrix.outputs.ksu_resolved_hash }}
      ksu_options_normalized: ${{ steps.set-matrix.outputs.ksu_options_normalized }}
      susfs_base_version: ${{ steps.set-matrix.outputs.susfs_base_version }}
      release_tag: ${{ steps.release-tag.outputs.release_tag }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_HTTP_TIMEOUT: 600
    steps:
      - name: Checkout Code (to access configs/)
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            configs/
          sparse-checkout-cone-mode: false

      - name: Generate build matrix
        id: set-matrix
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::Matrix generation"
          
          input="${{ github.event.inputs.op_model }}"
          ksu_options_raw='${{ github.event.inputs.ksu_options }}'
          if ! ksu_options_normalized=$(echo "$ksu_options_raw" | jq -c '
            map(
              if .type then
                .type |= (
                  ascii_upcase |
                  if . == "SUKISU" or . == "SUKISU-ULTRA" or . == "SUKISU_ULTRA" then "SUKISU"
                  elif . == "KSUN" or . == "KERNELSU-NEXT" or . == "KERNELSU_NEXT" or . == "NEXT" then "KSUN"
                  elif . == "KSU" or . == "KERNELSU" then "KSU"
                  else error("Unsupported ksu_type: " + .)
                  end
                ) |
                if (.hash // "") == "" then
                  if .type == "SUKISU" then .hash = "builtin"
                  elif .type == "KSUN" then .hash = "dev"
                  elif .type == "KSU" then .hash = "main"
                  else .hash end
                else . end
              else error("No type found") end
            )' 2>&1); then
            echo "::error::ksu_options validation failed: $ksu_options_normalized"
            exit 1
          fi
          
          echo "ksu_options_normalized=$ksu_options_normalized" >> $GITHUB_OUTPUT
          
          echo "[" > matrix.json
          # -mindepth 2 keeps configs/schema.json out. It has no "model" field,
          # and the device filter below calls startswith() on .model, which
          # aborts the whole matrix with "startswith() requires string inputs".
          mapfile -t all_json_files < <(find configs/ -mindepth 2 -name "*.json" -print0 | xargs -0 -n1)
          for i in "${!all_json_files[@]}"; do
            file="${all_json_files[$i]}"
            if [ -f "$file" ]; then
              jq -r '.' "$file" >> matrix.json
              if [ $((i+1)) -lt ${#all_json_files[@]} ]; then
                echo "," >> matrix.json
              fi
            fi
          done
          echo "]" >> matrix.json
          
          jq_filter="."
          
          case "$input" in
            All)
              ;;
            *)
              echo " Device-specific filter applied: $input"
              jq_filter="map(select(.model == \"$input\" or (.model | startswith(\"$input-\"))))"
              ;;
          esac
          
          android_input="${{ github.event.inputs.android_version_filter }}"
          android_jq_filter=""
          
          case "$android_input" in
            "All")
              ;;
            "A16")
              android_jq_filter=" | map(select(.os_version == \"A16\"))"
              ;;
            *)
              echo "::warning::Unknown Android version filter '$android_input'."
              ;;
          esac

          kernel_input="${{ github.event.inputs.kernel_version_filter }}"
          kernel_jq_filter=""
          
          if [[ "$kernel_input" != "All" ]]; then
            IFS='-' read -r ak_android ak_kernel <<< "$kernel_input"
            kernel_jq_filter=" | map(select(.android_version == \"$ak_android\" and .kernel_version == \"$ak_kernel\"))"
            echo " Kernel version filter applied: $kernel_input"
          fi

          combined_filter="${jq_filter}${android_jq_filter}${kernel_jq_filter}"
          filtered=$(jq -c "$combined_filter" matrix.json)
          count=$(jq 'length' <<<"$filtered")
          
          if [ "$count" -eq 0 ]; then
            echo "::error::No config files found for input '$input' after applying filters"
            echo ""
            echo "Available configurations:"
            jq -r '.[] | " - \(.model) (\(.os_version), \(.android_version)-\(.kernel_version))"' matrix.json
            exit 1
          fi

          # A profile carrying a 'blocked' reason cannot be built: no SUSFS patch
          # applies to its base. Drop it from the matrix so selecting a model
          # family builds the siblings that do work instead of failing the whole
          # run. If the selection resolves to nothing but blocked profiles, say
          # why here instead of 20 minutes into a build.
          blocked=$(jq -c '[.[] | select(.blocked? != null)]' <<<"$filtered")
          blocked_count=$(jq 'length' <<<"$blocked")
          if [ "$blocked_count" -gt 0 ]; then
            filtered=$(jq -c '[.[] | select(.blocked? == null)]' <<<"$filtered")
            count=$(jq 'length' <<<"$filtered")
            echo " Skipping $blocked_count blocked profile(s):"
            jq -r '.[] | "   \(.model) (\(.os_version), \(.android_version)-\(.kernel_version)): \(.blocked)"' <<<"$blocked"
            {
              echo ""
              echo "### Skipped: blocked profiles"
              echo ""
              echo "| Profile | KMI | Reason |"
              echo "|---|---|---|"
              jq -r '.[] | "| `\(.model)` | \(.android_version)-\(.kernel_version) | \(.blocked) |"' <<<"$blocked"
            } >> "$GITHUB_STEP_SUMMARY"
            if [ "$count" -eq 0 ]; then
              echo "::error::Every profile matching '$input' is blocked. Nothing to build."
              exit 1
            fi
          fi
          
          echo "$filtered" | jq '.' > matrix.json
          
          # For each device + each ksu option -> one combined entry
          merged_matrix=$(jq -n --slurpfile devices matrix.json --argjson ksu_list "$ksu_options_normalized" \
            '[ $devices[0][] as $dev | $ksu_list[] as $ksu | ($dev + {ksu_type: $ksu.type, ksu_hash: (if ($dev.ksu_hash? // null) != null then $dev.ksu_hash else $ksu.hash end)}) ]')
          
          # Sort matrix by OS version
          merged_matrix=$(echo "$merged_matrix" | jq -c 'sort_by(.os_version) | reverse')
          
          final_count=$(echo "$merged_matrix" | jq 'length')
          
          echo " Found $final_count device(s) to build"
          echo ""
          echo "Selected devices:"
          jq -r '.[] | " - \(.model) (\(.os_version), \(.android_version)-\(.kernel_version), \(.ksu_type) - \(.ksu_hash))"' <<<"$merged_matrix"
          
          echo "count=$final_count" >> "$GITHUB_OUTPUT"
          
          QUERY='query($owner: String!, $name: String!, $headRef: String!, $tagRef: String!, $objRef: String!) {
            repository(owner: $owner, name: $name) {
              hb: ref(qualifiedName: $headRef) { t: target { ... on Commit { o: oid } } }
              ht: ref(qualifiedName: $tagRef) { t: target { ... on Commit { o: oid } } }
              ho: object(expression: $objRef) { ... on Commit { o: oid } }
            }
          }'

          MAX_RETRIES=3
          RETRY_DELAY=5

          ksu_repo_for_type() {
            case "$1" in
              SUKISU) echo "SukiSU-Ultra SukiSU-Ultra" ;;
              KSUN)   echo "KernelSU-Next KernelSU-Next" ;;
              KSU)    echo "tiann KernelSU" ;;
              *)      echo "::error::Unknown ksu_type '$1'" >&2; exit 1 ;;
            esac
          }

          mapfile -t ksu_pairs < <(echo "$merged_matrix" | jq -r '
            [ .[] | "\(.ksu_type)|\(.ksu_hash)" ] | unique | .[]')

          declare -A ksu_resolved_map
          first_resolved_sha=""

          for pair in "${ksu_pairs[@]}"; do
            ktype="${pair%%|*}"
            kref="${pair#*|}"
            read -r KSU_REPO_OWNER KSU_REPO_NAME < <(ksu_repo_for_type "$ktype")
            echo "Resolving $ktype hash ($kref) in $KSU_REPO_OWNER/$KSU_REPO_NAME..."

            attempt=0
            resolved_sha=""
            while [ "$attempt" -lt "$MAX_RETRIES" ]; do
              RESULT=$(gh api graphql -f query="$QUERY" \
                -f owner="$KSU_REPO_OWNER" -f name="$KSU_REPO_NAME" \
                -f headRef="refs/heads/${kref}" -f tagRef="refs/tags/${kref}" \
                -f objRef="$kref" 2>/dev/null) || RESULT=""
              if [ -n "$RESULT" ]; then
                resolved_sha=$(echo "$RESULT" | jq -r '.data.repository | (.hb.t.o // .ht.t.o // .ho.o // "unknown")')
                [ "$resolved_sha" != "unknown" ] && break
                resolved_sha=""
              fi
              attempt=$((attempt + 1))
              echo "::warning::API failed for $ktype/$kref (Attempt $attempt/$MAX_RETRIES). Retrying in ${RETRY_DELAY}s..."
              sleep "$RETRY_DELAY"
            done

            if [ -z "$resolved_sha" ]; then
              echo "::error::Ref/Hash '$kref' does not exist in $KSU_REPO_OWNER/$KSU_REPO_NAME"
              exit 1
            fi

            ksu_resolved_map["$pair"]="$resolved_sha"
            [ -n "$first_resolved_sha" ] || first_resolved_sha="$resolved_sha"
            echo " Resolved: $ktype/$kref -> $resolved_sha"
          done

          echo "ksu_resolved_hash=${first_resolved_sha:-unknown}" >> "$GITHUB_OUTPUT"

          ksu_resolved_json=$(for k in "${!ksu_resolved_map[@]}"; do
            printf '%s\t%s\n' "$k" "${ksu_resolved_map[$k]}"
          done | jq -R -s 'split("\n") | map(select(length > 0) | split("\t") | {(.[0]): .[1]}) | add // {}')

          # Inject ksu_resolved_hash into each device in the matrix
          merged_matrix=$(echo "$merged_matrix" | jq \
            --argjson rmap "$ksu_resolved_json" \
            'map(.ksu_resolved_hash = ($rmap["\(.ksu_type)|\(.ksu_hash)"] // "unknown"))')
          
          # SUSFS hash fetch
          SUSFS_REPO="https://gitlab.com/simonpunk/susfs4ksu.git"
          GITLAB_PROJECT_PATH="simonpunk/susfs4ksu"
          
          declare -A default_branches=(
            ["android16-6.12"]="gki-android16-6.12"
          )

          declare -A user_inputs=(
            ["android16-6.12"]="${{ inputs.android16-6_12_susfs_branch_or_commit }}"
          )
          
          mapfile -t active_keys < <(
            echo "$merged_matrix" \
              | jq -r '.[] | select(.susfs == true) | "\(.android_version)-\(.kernel_version)"' \
              | sort -u
          )
          
          echo " Resolving SUSFS hashes for: ${active_keys[*]:-none}"
          
          declare -A susfs_hashes           # "<key>"       -> sha used by unpinned devices
          declare -A susfs_pin_hashes       # "<key>|<pin>" -> sha of that pin
          declare -A susfs_versions_per_ref # "<ref>"       -> SUSFS_VERSION

          MAX_RETRIES=3
          RETRY_DELAY=5

          # Resolve one GitLab ref. Sets RESOLVED_SHA / RESOLVED_VERSION in the
          # caller's scope - deliberately not a command substitution, because
          # array writes inside $( ) would be lost.
          RESOLVED_SHA=""
          RESOLVED_VERSION=""
          resolve_susfs_ref() {
            local ref="$1" label="$2" attempt=0 response sha ver query
            RESOLVED_SHA=""
            RESOLVED_VERSION=""
            # susfs.h is fetched on every build, not only for releases: the zip
            # name carries the release revision, and the revision is derived
            # from SUSFS_VERSION. One extra field on a query we already make.
            query="{ project(fullPath: \"${GITLAB_PROJECT_PATH}\") { repository { ch: commit(ref: \"${ref}\") { sha } blobs(paths: [\"kernel_patches/include/linux/susfs.h\"], ref: \"${ref}\") { nodes { rawBlob } } } } }"
            while [ "$attempt" -lt "$MAX_RETRIES" ]; do
              response=$(curl -s --fail -G "https://gitlab.com/api/graphql" --data-urlencode "query=$query") || response=""
              if [ -n "$response" ]; then
                sha=$(echo "$response" | jq -r '.data.project.repository.ch.sha // empty')
                if [ -n "$sha" ] && [ "$sha" != "null" ]; then
                  RESOLVED_SHA="$sha"
                  ver=$(echo "$response" \
                    | jq -r '.data.project.repository.blobs.nodes[0].rawBlob // empty' \
                    | grep '#define SUSFS_VERSION' | awk -F'"' '{print $2}')
                  RESOLVED_VERSION="${ver:-unknown}"
                  echo " $label ($ref) -> SUSFS_VERSION = $RESOLVED_VERSION"
                  return 0
                fi
              fi
              attempt=$((attempt + 1))
              echo "::warning::GitLab GraphQL API failed for $label ($ref) (Attempt $attempt/$MAX_RETRIES). Retrying..."
              sleep "$RETRY_DELAY"
            done
            return 1
          }

          for key in "${active_keys[@]}"; do
            default_val="${default_branches[$key]}"
            user_val="${user_inputs[$key]:-$default_val}"

            # Devices on this key that do NOT pin their own susfs_hash.
            unpinned=$(echo "$merged_matrix" | jq -r --arg key "$key" '
              [ .[] | select(.susfs == true)
                    | select((.android_version + "-" + .kernel_version) == $key)
                    | select((.susfs_hash // "") == "") ] | length')

            # Distinct pins on this key.
            mapfile -t key_pins < <(echo "$merged_matrix" | jq -r --arg key "$key" '
              [ .[] | select(.susfs == true)
                    | select((.android_version + "-" + .kernel_version) == $key)
                    | .susfs_hash // empty ] | unique | .[]')

            # The default ref is only needed when at least one device relies on
            # it. When every device pins, a renamed or deleted default branch
            # must not break the build.
            if [ "$unpinned" -gt 0 ]; then
              if resolve_susfs_ref "$user_val" "$key default"; then
                susfs_hashes["$key"]="$RESOLVED_SHA"
                [ -n "$RESOLVED_VERSION" ] && susfs_versions_per_ref["$user_val"]="$RESOLVED_VERSION"
                echo " Resolved: $key default ($user_val) -> $RESOLVED_SHA"
              else
                echo "::error::Could not resolve SUSFS ref '$user_val' for $key on GitLab."
                exit 1
              fi
            fi

            for pin in "${key_pins[@]}"; do
              if resolve_susfs_ref "$pin" "$key pin"; then
                susfs_pin_hashes["$key|$pin"]="$RESOLVED_SHA"
                [ -n "$RESOLVED_VERSION" ] && susfs_versions_per_ref["$pin"]="$RESOLVED_VERSION"
                echo " Resolved: $key pin ($pin) -> $RESOLVED_SHA"
                # Keep the per-key output meaningful when nothing uses the default.
                [ "$unpinned" -eq 0 ] && susfs_hashes["$key"]="$RESOLVED_SHA"
              else
                echo "::error::Could not resolve pinned SUSFS ref '$pin' for $key on GitLab."
                exit 1
              fi
            done

            if [ -z "${susfs_hashes[$key]:-}" ]; then
              echo "::error::No SUSFS ref resolved for $key."
              exit 1
            fi
          done

          # Write CSV list of active GKI versions
          active_gki_keys_csv=$(IFS=','; echo "${active_keys[*]:-}")
          echo "active_gki_keys=$active_gki_keys_csv" >> "$GITHUB_OUTPUT"

          # Write hash to GITHUB_OUTPUT
          echo "susfs_hash_android16_6_12=${susfs_hashes[android16-6.12]:-unknown}" >> "$GITHUB_OUTPUT"

          # SUSFS_VERSION. Always resolved: the zip name carries it and the
          # release revision is derived from it, so a plain build needs it too.
          # Refs are sorted so the pick is deterministic across runs (bash
          # associative array order is not).
          susfs_base_version="unknown"
          while IFS= read -r ref; do
            [ -n "$ref" ] || continue
            ver="${susfs_versions_per_ref[$ref]:-unknown}"
            if [ "$ver" != "unknown" ]; then
              susfs_base_version="$ver"
              break
            fi
          done < <(printf '%s\n' "${!susfs_versions_per_ref[@]}" | sort)

          if [ "$susfs_base_version" = "unknown" ]; then
            if [ "${{ inputs.make_release }}" = "true" ]; then
              echo "::error::Could not extract SUSFS_VERSION from susfs.h for any resolved ref. Cannot proceed with release."
              exit 1
            fi
            echo "::warning::SUSFS_VERSION not resolved; zip names will not carry a release revision."
          else
            # make_release=true: every ref compiled in (defaults and pins alike)
            # must agree, otherwise the release tag would describe a version
            # that is not in every zip. Compared before the v prefix is added.
            if [ "${{ inputs.make_release }}" = "true" ]; then
              for ref in "${!susfs_versions_per_ref[@]}"; do
                ref_ver="${susfs_versions_per_ref[$ref]:-unknown}"
                if [ "$ref_ver" != "$susfs_base_version" ]; then
                  echo "::error::SUSFS version mismatch: ref '$ref' has '$ref_ver', expected '$susfs_base_version'. Align refs before releasing."
                  exit 1
                fi
              done
            fi

            # Ensure v prefix for standardized versioning
            [[ "$susfs_base_version" != v* ]] && susfs_base_version="v$susfs_base_version"
            echo "susfs_base_version=$susfs_base_version" >> "$GITHUB_OUTPUT"
          fi

          # Inject susfs_resolved_hash into each device in the matrix
          susfs_hashes_json=$(jq -n \
            --arg a16 "${susfs_hashes[android16-6.12]:-unknown}" \
            '{
              "android16-6.12": $a16
            }')

          susfs_pins_json=$(for k in "${!susfs_pin_hashes[@]}"; do
            printf '%s\t%s\n' "$k" "${susfs_pin_hashes[$k]}"
          done | jq -R -s 'split("\n") | map(select(length > 0) | split("\t") | {(.[0]): .[1]}) | add // {}')

          # Per device: a pin wins over the key default. Unpinned devices keep
          # using the default ref, so one device pinning must never change what
          # its neighbours compile in.
          merged_matrix=$(echo "$merged_matrix" | jq \
            --argjson hashes "$susfs_hashes_json" \
            --argjson pins "$susfs_pins_json" \
            '[.[] | . + {susfs_resolved_hash: (
                if (.susfs_hash? // "") != ""
                then ($pins["\(.android_version)-\(.kernel_version)|\(.susfs_hash)"] // "unknown")
                else ($hashes["\(.android_version)-\(.kernel_version)"] // "unknown")
                end)}]')
          
          merged_matrix=$(echo "$merged_matrix" | jq '
            sort_by(
              (.os_version | gsub("A"; "") | tonumber? // 0) * -1,
              .model
            )
          ')
          
          # Wrap A16 matrix for build-A16
          matrix_A16=$(echo "$merged_matrix" | jq -c 'map(select(.os_version == "A16")) | {include: .}')
          echo "matrix_A16=$matrix_A16" >> "$GITHUB_OUTPUT"
          
          # Maintain compatibility for existing job
          wrapped=$(jq -c '{ include: . }' <<< "$merged_matrix")
          echo "matrix=$wrapped" >> "$GITHUB_OUTPUT"
          
          echo "::endgroup::"

      - name: Upload build matrix
        uses: actions/upload-artifact@v7
        with:
          name: build-matrix
          path: matrix.json
          archive: false
          retention-days: 7

      - name: Build plan summary
        run: |
          ksu_display=$(jq -r '[.[] | "`\(.ksu_type)` (`\(.ksu_hash)` -> `\(.ksu_resolved_hash[0:8])`)"] | unique | join(", ")' matrix.json 2>/dev/null || true)
          if [ -z "$ksu_display" ] || [ "$ksu_display" = "null" ]; then
            ksu_display=$(echo '${{ steps.set-matrix.outputs.ksu_options_normalized }}' | jq -r '[.[] | "`\(.type)` (`\(.hash)`)"] | join(", ")')
          fi
          
          build_ts_input="${{ inputs.build_timestamp }}"
          if [ -z "$build_ts_input" ]; then
            build_ts_display="auto (current build time)"
          else
            build_ts_display=" \`$build_ts_input\`"
          fi
          
          {
            cat << 'EOF'
          ## Build Plan
          
          **Target:** ${{ inputs.op_model }}
          **Devices:** ${{ steps.set-matrix.outputs.count }}
          
          **Configuration:**
          EOF
          
            echo "- KSU Config: $ksu_display"
            echo "- Build Timestamp: $build_ts_display"
          
            cat << 'EOF'
          - Optimization: ${{ inputs.optimize_level }}
          - MLGO: ${{ inputs.mlgo }}
          - Clean Build/No Ccache: ${{ inputs.clean_build && ' Yes' || ' No' }}
          - Create Release: ${{ inputs.make_release && ' Yes' || ' No' }}
          - Create Debug Artifacts: ${{ inputs.debug && ' Yes' || ' No' }}
          
          **SUSFS Configuration:**
          EOF
          } >> "$GITHUB_STEP_SUMMARY"
          
          # Display SUSFS config for each kernel version
          declare -A susfs_inputs=(
            ["android16-6.12"]="${{ inputs.android16-6_12_susfs_branch_or_commit }}"
          )
          
          declare -A step_hashes=(
            ["android16-6.12"]="${{ steps.set-matrix.outputs.susfs_hash_android16_6_12 }}"
          )
          
          # Iterate only on the GKI versions present in this run
          IFS=',' read -ra active_keys_display \
            <<< "${{ steps.set-matrix.outputs.active_gki_keys }}"
          
          for key in "${active_keys_display[@]}"; do
            value="${susfs_inputs[$key]:-}"
            fetched_hash="${step_hashes[$key]:-unknown}"
            
            if [ -z "$value" ]; then
              # Auto: no input > hash resolved by ls-remote
              echo "- $key: auto (\`$fetched_hash\`)" >> $GITHUB_STEP_SUMMARY
            elif [[ "$value" =~ ^[0-9a-f]{40}$ ]]; then
              # Manual 40-char hash > direct passthrough
              echo "- $key: \`$value\`" >> $GITHUB_STEP_SUMMARY
            else
              # Branch name > show branch + resolved hash
              echo "- $key: \`$value\` (\`$fetched_hash\`)" >> $GITHUB_STEP_SUMMARY
            fi
          done
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> **Note:** Hashes are resolved at run time via API calls before builds start." >> $GITHUB_STEP_SUMMARY

      - name: Resolve release tag
        id: release-tag
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::Resolve release tag"
          base="${{ steps.set-matrix.outputs.susfs_base_version }}"
          custom="${{ inputs.custom_release_tag }}"

          # Resolved once here, before any build starts, so every zip is named
          # with the revision it will be published under and the release job
          # cannot pick a different one.
          if [ -n "$custom" ]; then
            tag="$custom"
            echo "   custom tag: $tag"
          elif [ -z "$base" ] || [ "$base" = "unknown" ]; then
            tag=""
            echo "   SUSFS version unresolved, no release tag"
            echo "::warning::SUSFS_VERSION did not resolve, so the zips will not carry a release revision. Set custom_release_tag to override."
          else
            max_rev=0
            while IFS= read -r name; do
              [ -n "$name" ] || continue
              case "$name" in
                "${base}-r"*)
                  rev="${name#"${base}-r"}"
                  if [[ "$rev" =~ ^[0-9]+$ ]] && [ "$rev" -gt "$max_rev" ]; then
                    max_rev="$rev"
                  fi
                  ;;
              esac
            done < <(gh api "repos/${{ github.repository }}/tags" --paginate --jq '.[].name' 2>/dev/null || true)
            tag="${base}-r$((max_rev + 1))"
            echo "   highest existing revision for $base: ${max_rev}, next: $tag"
          fi

          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"
          echo "::endgroup::"

  mirror_toolchain:
    needs: set-op-model
    if: ${{ inputs.sync_toolchains }}
    uses: ./.github/workflows/mirror-toolchains.yml
    secrets: inherit

  prepare_ccache:
    name: Prepare ccache binary (download once)
    runs-on: ubuntu-latest
    steps:
      - name: Download custom ccache once
        run: |
          set -uo pipefail
          echo "::group::Download ccache"
          url="https://github.com/cctv18/ccache-ECS/releases/download/ccache-ECS-v1.0/linux-x86_64-glibc-binary.zip"
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if curl -LfsS --connect-timeout 30 --max-time 120 "$url" -o /tmp/ccache.zip && unzip -o /tmp/ccache.zip -d /tmp; then
              ok=1; break
            fi
            echo "attempt $attempt failed (504/throttle); backing off..."
            sleep $(( attempt * 5 + RANDOM % 6 ))
          done
          if [ "$ok" = 1 ]; then
            mv /tmp/ccache ./ccache
            echo " downloaded ccache once for all matrix jobs"
          else
            echo "::warning::custom ccache download failed; matrix jobs will fall back to the apt ccache"
            rm -f ./ccache
          fi
          echo "::endgroup::"
      - name: Upload ccache artifact
        uses: actions/upload-artifact@v7
        with:
          name: ccache-binary
          path: ccache
          retention-days: 1
          if-no-files-found: warn

  build-A16:
    name: build-A16 (${{ matrix.model }}, ${{ matrix.ksu_type == 'SUKISU' && 'SukiSU-Ultra' || (matrix.ksu_type == 'KSUN' && 'KernelSU-Next' || matrix.ksu_type) }})
    needs: [set-op-model, prepare_ccache, mirror_toolchain]
    if: |
      !cancelled() &&
      needs.set-op-model.result == 'success' &&
      (needs.mirror_toolchain.result == 'success' || needs.mirror_toolchain.result == 'skipped') &&
      inputs.workflow_mode == 'Build & Release' &&
      fromJSON(needs.set-op-model.outputs.matrix_A16).include[0] != null
    runs-on: ubuntu-latest
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      LDCACHE_DIR: ${{ github.workspace }}/.ld_cache
      CCACHE_LOGFILE: ${{ github.workspace }}/ccache.log
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.set-op-model.outputs.matrix_A16) }}
    timeout-minutes: 180
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
      - name: Get prebuilt ccache (downloaded once by prepare_ccache)
        uses: actions/download-artifact@v8
        with:
          name: ccache-binary
          path: ccache-dl
        continue-on-error: true
      - name: Set up ccache
        run: |
          if [ -f ccache-dl/ccache ]; then
            sudo cp ccache-dl/ccache /usr/local/bin/
            sudo chmod +x /usr/local/bin/ccache
            ccache --version
          else
            echo "::warning::ccache binary not found from artifact. Falling back to apt ccache."
            sudo apt-get -o Acquire::Retries=3 update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ccache
            ccache --version
          fi
      - name: Build Kernel
        uses: ./.github/actions/build-kernel
        with:
          op_config_json: ${{ toJSON(matrix) }}
          ksu_type: ${{ matrix.ksu_type }}
          ksu_branch_or_hash: ${{ matrix.ksu_resolved_hash }}
          susfs_commit_hash_or_branch: ${{ matrix.susfs_resolved_hash }}
          optimize_level: ${{ inputs.optimize_level }}
          mlgo: ${{ inputs.mlgo }}
          build_timestamp: ${{ inputs.build_timestamp }}
          clean: ${{ inputs.clean_build }}
          debug: ${{ inputs.debug }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          ksu_mode: ${{ inputs.ksu_mode }}
          lto_override: ${{ inputs.lto_override }}
          release_tag: ${{ needs.set-op-model.outputs.release_tag }}
          autofdo_profile_url: ${{ inputs.autofdo_profile_url }}
          autofdo_profile_sha256: ${{ inputs.autofdo_profile_sha256 }}
          enable_etm: ${{ inputs.enable_etm }}

  trigger-release:
    needs: [set-op-model, build-A16]
    runs-on: ubuntu-latest
    if: ${{ always() && inputs.make_release && !cancelled() && (inputs.workflow_mode == 'Release Only' || !failure()) }}
    environment: ${{ github.ref_name == 'main' && 'Production-Release' || '' }}
    env:
      REPO_OWNER: ${{ github.repository_owner }}
      REPO_NAME: ${{ github.event.repository.name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SUSFS_BASE_VERSION: ${{ needs.set-op-model.outputs.susfs_base_version }}
      RELEASE_NAME: 'OnePlus 15 (ColorOS 17) Kernel With SukiSU-Ultra, KernelSU-Next & SUSFS ${{ needs.set-op-model.outputs.susfs_base_version }}'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create New Tag
        run: |
          set -euo pipefail
          # Resolved in set-op-model before the builds started, so the tag and
          # the zip names cannot disagree.
          NEW_TAG="${{ needs.set-op-model.outputs.release_tag }}"
          if [ -z "$NEW_TAG" ]; then
            echo "::error::No release tag was resolved. Set custom_release_tag, or make sure SUSFS_VERSION resolves."
            exit 1
          fi
          echo "New tag: $NEW_TAG"

          if git rev-parse -q --verify "refs/tags/$NEW_TAG" >/dev/null; then
            echo "::error::Tag $NEW_TAG already exists. Another release landed while this run was building; re-run with a custom_release_tag."
            exit 1
          fi

          echo "NEW_TAG=${NEW_TAG}" >> $GITHUB_ENV
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$NEW_TAG"
          git push origin "$NEW_TAG"

      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./downloaded-artifacts
          merge-multiple: true
          skip-decompress: true
          run-id: ${{ inputs.workflow_mode == 'Release Only' && inputs.run_id_to_release || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: List Downloaded Artifacts
        run: |
          rm -f ./downloaded-artifacts/ccache-binary.zip \
                ./downloaded-artifacts/*_kmi_report.zip \
                ./downloaded-artifacts/*_patch_rejects.zip \
                ./downloaded-artifacts/*_Debug.zip \
                ./downloaded-artifacts/debug_*.zip
          echo "=== Downloaded artifacts ==="
          if [ -d "./downloaded-artifacts" ]; then
            find ./downloaded-artifacts -type f | sort
            echo "---"
            echo "Total zip files: $(find ./downloaded-artifacts -maxdepth 1 -name '*.zip' -type f | wc -l)"
          else
            echo " downloaded-artifacts directory does not exist"
          fi

      - name: Check zip names match the tag
        run: |
          set -euo pipefail
          tag_rev=""
          if [[ "$NEW_TAG" =~ -r([0-9]+)$ ]]; then
            tag_rev="-r${BASH_REMATCH[1]}"
          fi
          echo "Tag $NEW_TAG carries revision '${tag_rev:-none}'"

          mismatched=0
          for zip in ./downloaded-artifacts/*.zip; do
            [ -f "$zip" ] || continue
            name=$(basename "$zip" .zip)
            zip_rev=""
            if [[ "$name" =~ [_-]r([0-9]+)([_-]|$) ]]; then
              zip_rev="-r${BASH_REMATCH[1]}"
            fi
            if [ -z "$zip_rev" ]; then
              echo "::warning::$name carries no release revision, but the tag is $NEW_TAG"
            elif [ "$zip_rev" != "$tag_rev" ]; then
              echo "::error::$name says $zip_rev but the tag says ${tag_rev:-none}"
              mismatched=1
            else
              echo "   $name matches $tag_rev"
            fi
          done
          [ "$mismatched" -eq 0 ] || exit 1

      - name: Generate Device List and Final Release Notes
        id: generate-notes
        env:
          KSU_MODE_INPUT: ${{ inputs.ksu_mode }}
          CUSTOM_CHANGELOG: ${{ inputs.custom_changelog }}
          RUN_ID_VALUE: ${{ github.run_id }}
        run: |
          set -euo pipefail
          echo "=== Start building the release notes ==="

          PREV_TAG=$(git tag --merged HEAD --sort=-creatordate | grep -v -E "^(${NEW_TAG}|ccache-cache|toolchain-cache)$" | head -n1 || true)
          if [ -n "$CUSTOM_CHANGELOG" ]; then
            CHANGELOG_TEXT="$CUSTOM_CHANGELOG"
          elif [ -n "$PREV_TAG" ]; then
            CHANGELOG_TEXT=$(git log "$PREV_TAG..HEAD" --oneline -n 15 --pretty=format:"- %s (%h)" || git log -n 15 --oneline --pretty=format:"- %s (%h)")
          else
            CHANGELOG_TEXT=$(git log -n 15 --oneline --pretty=format:"- %s (%h)")
          fi
          export CHANGELOG_TEXT

          python3 - <<'PY'
          import datetime
          import json
          import os
          import pathlib
          import subprocess

          repo_owner = os.environ["REPO_OWNER"]
          repo_name = os.environ["REPO_NAME"]
          new_tag = os.environ["NEW_TAG"]
          susfs_base = os.environ.get("SUSFS_BASE_VERSION", "unknown")
          ksu_mode = os.environ.get("KSU_MODE_INPUT", "builtin")
          run_id = os.environ.get("RUN_ID_VALUE", "")
          changelog_text = os.environ.get("CHANGELOG_TEXT", "").strip()

          artifacts_dir = pathlib.Path("./downloaded-artifacts")
          info_files = sorted(artifacts_dir.glob("*_build-info.json"))
          zip_files = {p.name: p for p in sorted(artifacts_dir.glob("*.zip"))}

          matrix_path = artifacts_dir / "matrix.json"
          matrix_data = json.loads(matrix_path.read_text()) if matrix_path.is_file() else []

          builds = []
          for p in info_files:
              data = json.loads(p.read_text())
              zip_name = data.get("artifact", {}).get("zip_name") or ""
              zip_path = zip_files.get(zip_name)
              if zip_path is None and zip_files:
                  stem = p.name.removesuffix("_build-info.json")
                  zip_path = zip_files.get(f"{stem}.zip")
              zsha = (data.get("artifact", {}) or {}).get("zip_sha256") or ""
              if zip_path and zip_path.is_file():
                  zsha = subprocess.check_output(["sha256sum", str(zip_path)], text=True).split()[0]
              builds.append((data, p.name, zsha or "unavailable"))

          ksu_summaries = []
          for data, _, _ in builds:
              k = data.get("ksu", {})
              kvar = k.get("variant") or ("SukiSU-Ultra" if k.get("type") == "SUKISU" else ("KernelSU-Next" if k.get("type") == "KSUN" else k.get("type", "KSU")))
              kver = k.get("version") or "unknown"
              entry = f"{kvar} {kver}"
              if entry not in ksu_summaries:
                  ksu_summaries.append(entry)
          ksu_summary_str = " & ".join(ksu_summaries) if ksu_summaries else "SukiSU-Ultra / KernelSU-Next"
          now_utc = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d %H:%M UTC")
          variant_names = []
          for data, _, _ in builds:
              k = data.get("ksu", {})
              kvar = k.get("variant") or ("SukiSU-Ultra" if k.get("type") == "SUKISU" else ("KernelSU-Next" if k.get("type") == "KSUN" else k.get("type", "KSU")))
              if kvar not in variant_names:
                  variant_names.append(kvar)
          title_variants = " / ".join(variant_names) if variant_names else "SukiSU-Ultra & KernelSU-Next"
          release_title = f"OnePlus 15 (ColorOS 17) Kernel With {title_variants} & SUSFS {susfs_base}"

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_f:
              env_f.write(f"RELEASE_TITLE={release_title}\n")

          lines = [
              f"# OnePlus 15 (ColorOS 17) Kernel {new_tag}",
              "",
              f"Built: {now_utc} | Run: `{run_id}` | {ksu_summary_str} | SUSFS {susfs_base}",
              "",
              f"## Built zips ({len(builds) or len(zip_files)})",
              "",
          ]

          for data, _, zsha in builds:
              dev = data.get("device", {})
              kern = data.get("kernel", {})
              art = data.get("artifact", {})
              k = data.get("ksu", {})
              kvar = k.get("variant") or ("SukiSU-Ultra" if k.get("type") == "SUKISU" else ("KernelSU-Next" if k.get("type") == "KSUN" else k.get("type", "KSU")))
              kver = k.get("version") or "unknown"
              zname = art.get("zip_name", "")
              zurl = f"https://github.com/{repo_owner}/{repo_name}/releases/download/{new_tag}/{zname}"
              lines.append(f"- [`{zname}`]({zurl}) - {dev.get('model')}, {dev.get('os_version')}, kernel `{kern.get('full_version')}`, **{kvar}** `{kver}`")
              lines.append(f"  - `sha256: {zsha}`")

          lines.extend(["", "## Tested on hardware", ""])
          seen_tested = set()
          tested_rows = []
          for m in matrix_data:
              key = (m.get("model"), m.get("os_version"))
              if m.get("tested") and key not in seen_tested:
                  seen_tested.add(key)
                  tested_rows.append((m.get("model"), m.get("os_version"), m.get("tested")))
          if tested_rows:
              lines.extend(["| Profile | OS | What was verified |", "|---|---|---|"])
              for m_model, m_os, m_note in tested_rows:
                  lines.append(f"| `{m_model}` | {m_os} | {m_note} |")
              lines.append("")

          lines.extend([
              "## Build provenance",
              "",
              "Every zip ships a `build-info.json` recording the exact kernel source commit, the SUSFS and root variant revisions, the toolchain, and the image/zip checksums.",
              "",
          ])
          for _, info_name, _ in builds:
              iurl = f"https://github.com/{repo_owner}/{repo_name}/releases/download/{new_tag}/{info_name}"
              lines.append(f"- [`{info_name}`]({iurl})")

          import urllib.request

          def fetch_json(url):
              req = urllib.request.Request(url, headers={"Accept": "application/vnd.github+json", "User-Agent": "op15-gki-kernel-ci"})
              try:
                  with urllib.request.urlopen(req, timeout=10) as resp:
                      return json.loads(resp.read().decode("utf-8"))
              except Exception:
                  return None

          sukisu_apk_url = "https://github.com/SukiSU-Nova/SukiSU-Nova/releases/download/v3.0.0/SukiSU_Nova_v3.0.0_35000-arm64-v8a-release.apk"
          sukisu_rel = fetch_json("https://api.github.com/repos/SukiSU-Nova/SukiSU-Nova/releases/latest")
          if isinstance(sukisu_rel, dict):
              for asset in sukisu_rel.get("assets", []):
                  name = asset.get("name", "")
                  if name.endswith("-arm64-v8a-release.apk") and asset.get("browser_download_url"):
                      sukisu_apk_url = asset["browser_download_url"]
                      break

          ksun_apk_url = "https://github.com/KernelSU-Next/KernelSU-Next/releases/download/v3.4.2/KernelSU_Next_v3.4.2_33355-release.apk"
          ksun_rel = fetch_json("https://api.github.com/repos/KernelSU-Next/KernelSU-Next/releases/latest")
          if isinstance(ksun_rel, dict):
              for asset in ksun_rel.get("assets", []):
                  name = asset.get("name", "")
                  if name.endswith("-release.apk") and "spoofed" not in name and asset.get("browser_download_url"):
                      ksun_apk_url = asset["browser_download_url"]
                      break

          ksun_ci_url = ""
          ksun_commit = next((b[0].get("ksu", {}).get("commit", "") for b in builds if b[0].get("ksu", {}).get("type") == "KSUN"), "")
          if ksun_commit:
              runs = fetch_json(f"https://api.github.com/repos/KernelSU-Next/KernelSU-Next/actions/runs?head_sha={ksun_commit}")
              if isinstance(runs, dict):
                  for run in runs.get("workflow_runs", []):
                      if run.get("name") == "Build Manager CI" and run.get("conclusion") == "success":
                          arts = fetch_json(f"https://api.github.com/repos/KernelSU-Next/KernelSU-Next/actions/runs/{run['id']}/artifacts")
                          mgr_id = next((a["id"] for a in (arts or {}).get("artifacts", []) if a.get("name") == "manager"), None)
                          ksun_ci_url = f"https://github.com/KernelSU-Next/KernelSU-Next/actions/runs/{run['id']}/artifacts/{mgr_id}" if mgr_id else run.get("html_url", "")
                          break

          ksun_mgr_note = f"[KernelSU-Next CI manager (`{ksun_commit[:8]}`)]({ksun_ci_url}) (or [release APK]({ksun_apk_url}) for UAPI v5)" if ksun_ci_url else f"[KernelSU-Next Manager APK]({ksun_apk_url})"

          lines.extend([
              "",
              "## Kernel contents",
              "",
              f"- Root variants (`{ksu_mode}`): [KernelSU-Next](https://github.com/KernelSU-Next/KernelSU-Next) (`_KSUN.zip`).",
              f"- Manager APKs: {ksun_mgr_note}.",
              f"- [SUSFS](https://gitlab.com/simonpunk/susfs4ksu) {susfs_base} - magic mount, SUS_PATH / SUS_MOUNT / SUS_KSTAT / SUS_MAP, uname & cmdline spoofing, open redirect.",
              "- Scheduler, memory, power & network: BORE, ADIOS, DAMON, curated suspend/wakeup optimisations (`opt`), NTSync, Droidspaces (`SYSVIPC` kABI-safe + ghost task), BBR/BBR3, TTL, IP set, Unicode bypass, and 6.12 CVE backports.",
              "- NoMount support.",
              "- Allow 900mA instead of 500mA for (SDP) USB data ports.",
              "",
              "## Verifying your download",
              "",
              "Compare the checksum of the file you downloaded against the one listed above:",
              "",
              "```sh",
              "sha256sum <your-zip>.zip",
              "```",
              "",
              "A mismatch means a truncated or tampered download - do not flash it.",
              "",
              "## Flashing",
              "",
              f"Back up stock `boot` and `init_boot` before flashing. If switching from SukiSU LKM (`init_boot` patched) to a `builtin` kernel, restore stock `init_boot` first. Flash the zip with [Kernel Flasher](https://github.com/fatalcoder524/KernelFlasher) or [Horizon Kernel Flasher](https://github.com/libxzr/HorizonKernelFlasher), reboot, then install the matching manager APK ([SukiSU-Nova]({sukisu_apk_url}) or {ksun_mgr_note}).",
              "",
              "## Changelog",
              "",
              "```text",
              changelog_text or "Initial release",
              "```",
              "",
              "### Previous Releases",
              f"See the [Releases page](https://github.com/{repo_owner}/{repo_name}/releases).",
          ])

          pathlib.Path("release_notes.md").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

          cat release_notes.md >> "$GITHUB_STEP_SUMMARY"
          cat release_notes.md

      - name: Create GitHub Release
        env:
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          extra_flags=()
          if [ "${PUBLISH_RELEASE}" != "true" ]; then
            extra_flags+=(--draft)
          fi
          if [ "${PRERELEASE}" = "true" ]; then
            extra_flags+=(--prerelease)
          fi
          gh release create "$NEW_TAG" \
            --repo "${{ env.REPO_OWNER }}/${{ env.REPO_NAME }}" \
            --title "${RELEASE_TITLE}" \
            --notes-file release_notes.md \
            "${extra_flags[@]}"

      - name: Upload Release Assets Dynamically
        run: |
          set -euo pipefail
          shopt -s nullglob

          zips=(./downloaded-artifacts/*.zip)
          infos=(./downloaded-artifacts/*_build-info.json)

          if [ ${#zips[@]} -eq 0 ]; then
            echo "::error::No zips found in ./downloaded-artifacts - refusing to publish an empty release"
            exit 1
          fi

          echo "Uploading ${#zips[@]} zip(s) and ${#infos[@]} build-info file(s) to $NEW_TAG"
          for file in "${zips[@]}" "${infos[@]}"; do
            echo "Uploading $file..."
            gh release upload "$NEW_TAG" "$file" --clobber
          done

          echo "=== Assets attached to $NEW_TAG ==="
          gh release view "$NEW_TAG" --json assets --jq '.assets[].name' | sort

          attached=$(gh release view "$NEW_TAG" --json assets --jq '.assets | length')
          if [ "$attached" -lt "${#zips[@]}" ]; then
            echo "::error::Expected at least ${#zips[@]} assets on $NEW_TAG, found $attached"
            exit 1
          fi
          echo "All ${#zips[@]} zip(s) attached"

      - name: Release summary
        if: success()
        env:
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
        run: |
          status_label=$([ "${PUBLISH_RELEASE}" = "true" ] && echo "Published" || echo "Created as DRAFT")
          {
            echo ""
            echo "---"
            echo ""
            echo "## Release ${status_label}"
            echo ""
            echo "**Release URL:** [View Release](${{ github.server_url }}/${{ github.repository }}/releases/tag/${NEW_TAG})"
            echo "**Tag:** [\`${NEW_TAG}\`](${{ github.server_url }}/${{ github.repository }}/releases/tag/${NEW_TAG})"
            echo "**Title:** ${RELEASE_TITLE}"
            echo "**Kernels:** $(find ./downloaded-artifacts -maxdepth 1 -name "*.zip" -type f | wc -l)"
            echo ""
            echo "### Assets"
            for zip in ./downloaded-artifacts/*.zip; do
              if [ -f "$zip" ]; then
                name=$(basename "$zip")
                size=$(stat -c%s "$zip")
                size_mb=$(echo "scale=2; $size / 1024 / 1024" | bc)
                echo "- \`$name\` (${size_mb} MiB)"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

